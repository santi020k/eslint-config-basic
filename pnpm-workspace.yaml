    vite: ^7.3.6
  conflicts_typescript_ge5_0_0_l7_0_0:
    typescript: '>=5.0.0 <7.0.2'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  cypress: true
  esbuild: true
  msgpackr-extract: false
  prisma: false
  sharp: true
  unrs-resolver: false
  workerd: true

peerDependencyRules:
  allowedVersions:
    # Nuxt's CLI provides cac 7, but @bomb.sh/tab still declares only cac 6.
    '@bomb.sh/tab>cac': ^7.0.0
    eslint: "*"
    typescript: "*"

