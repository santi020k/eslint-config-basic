  '@prisma/engines': true
  '@scarf/scarf': false
  cypress: true
  esbuild: true
  prisma: false
  sharp: true
  unrs-resolver: false
  workerd: true

peerDependencyRules:
  allowedVersions:
    eslint: "*"
    typescript: "*"

# The minimum-release-age policy is supplied by the pnpm environment.
# Keep temporary exceptions explicit so lockfile verification remains reproducible.
minimumReleaseAgeExclude:
  - '@es-joy/jsdoccomment@0.90.0'
  - '@playwright/test@1.62.0'
  - '@santi020k/lumen-astro@0.3.0'
  - '@santi020k/lumen-core@0.3.0'
