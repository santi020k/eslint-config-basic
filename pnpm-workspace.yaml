peerDependencyRules:
  allowedVersions:
    # Nuxt's CLI provides cac 7, but @bomb.sh/tab still declares only cac 6.
    '@bomb.sh/tab>cac': ^7.0.0
    eslint: "*"
    typescript: "*"

