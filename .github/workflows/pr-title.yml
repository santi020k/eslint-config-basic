# Managed by the santi020k PR title standard.
name: PR Title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request
            if (pullRequest.labels.some(label => label.name === 'autorelease: pending')) {
              core.info('Skipping the automatically generated release title.')
              return
            }
            const types = ['feat', 'fix', 'docs', 'style', 'chore', 'refactor', 'perf', 'test', 'ci', 'build', 'revert']
            const match = /^([a-z]+)(?:\([^)]+\))?!?: (.+)$/.exec(pullRequest.title)
            if (!match || !types.includes(match[1]) || !/^(?![A-Z]).+$/.test(match[2])) {
              core.setFailed('Use a Conventional Commit title with a supported type and a lowercase subject, for example: feat: add repository-aware prompts')
            }
