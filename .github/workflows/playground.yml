name: Playground Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    name: Lint all playgrounds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version-file: .nvmrc
          task-cache-path: .turbo/cache
          task-cache-key: eslint-packages
          install: false

      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Lint affected playgrounds
        run: pnpm exec turbo run lint --affected --filter="@playground/*" --filter="@santi020k/playground-*"
