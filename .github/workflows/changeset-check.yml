name: Changeset Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Require changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip for version-packages PRs, release/* branches, and skip-changelog label
    if: >-
      ${{
        !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
        !startsWith(github.event.pull_request.title, 'chore(release): version packages') &&
        !startsWith(github.head_ref, 'release/')
      }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version: 22.x

      - name: Assert changeset present
        run: pnpm exec changeset status --since=origin/main

      - name: Keep Full releases synchronized with aggregated packages
        run: pnpm run check:full-release
