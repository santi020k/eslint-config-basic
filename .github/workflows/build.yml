name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Config Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Turborepo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-22.x-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-22.x-
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run contract and invariant tests
        run: pnpm --filter @santi020k/eslint-config-tests exec vitest run src/contracts.test.ts src/invariants.test.ts --maxWorkers=1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x ]

    # Turbo remote cache — set TURBO_TOKEN and TURBO_TEAM in repo secrets for cross-run caching
    # See: https://turbo.build/repo/docs/ci/github-actions#remote-caching
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Turborepo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm run build
      - name: Run concurrent CI checks (Node 22.x)
        if: matrix.node-version == '22.x'
        run: pnpm exec turbo run typecheck lint test:coverage //#lint:spell //#lint:knip //#lint:repo
      - name: Run concurrent CI checks (Node 24.x)
        if: matrix.node-version == '24.x'
        run: pnpm exec turbo run typecheck lint test:coverage
        env:
          # better-tailwindcss uses Synckit workers that can exceed the default
          # 30-second timeout while the full workspace runs concurrently.
          SYNCKIT_TIMEOUT: 120000
      - name: Build docs (smoke check)
        if: matrix.node-version == '22.x'
        run: pnpm run docs:sync-readmes && pnpm run docs:build
      - name: Check package READMEs are in sync
        if: matrix.node-version == '22.x'
        run: git diff --exit-code -- 'packages/*/README.md' || (echo 'Package READMEs are stale. Run `pnpm run docs:sync-readmes` and commit the result.' && exit 1)
      - name: Package metrics
        run: pnpm run check:package-metrics
      - name: Dry-run publish check
        run: pnpm run check:publish-dry-run
      - name: Check published types (attw)
        if: matrix.node-version == '22.x'
        run: pnpm run check:attw

  windows-smoke:
    name: Windows smoke (CLI + detection)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build (serialised to avoid native-binary contention on Windows)
        run: pnpm exec turbo run build --concurrency=1 --output-logs=new-only
      - name: Run CLI and detection tests on Windows
        run: pnpm --filter @santi020k/eslint-config-tests exec vitest run src/cli.test.ts src/detection.test.ts src/detection-fixtures.test.ts src/detection-internals.test.ts --maxWorkers=1
