# cspell:words tlsv
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact-plan:
    name: Quality v2 impact plan (shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install published Quality v2
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error https://raw.githubusercontent.com/santi020k/quality/ff490e9efbd5fdfbdb1e6c404f1741d04c57f585/install.sh -o "$RUNNER_TEMP/install-quality.sh"
          QUALITY_INSTALL_DIR="$RUNNER_TEMP/quality-bin" sh "$RUNNER_TEMP/install-quality.sh" santi020k/quality v2.0.0
          echo "$RUNNER_TEMP/quality-bin" >> "$GITHUB_PATH"
      - name: Test conservative policy and gate
        run: node --test scripts/quality-impact.node-test.mjs
      - name: Record source-only plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -n "$BASE_SHA" && "$HEAD_REF" != release/* && "$HEAD_REF" != changeset-release/* ]]; then
            quality impact plan --base "$BASE_SHA" --head HEAD --format json > "$RUNNER_TEMP/quality-impact.json"
          else
            quality impact plan --full --format json > "$RUNNER_TEMP/quality-impact.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: quality-impact-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-impact.json
          if-no-files-found: error
          retention-days: 7

  scope:
    name: Compatibility scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      windows: ${{ steps.windows.outputs.required }}

    steps:
      # Windows coverage always runs on main and on release candidates. Ordinary
      # pull requests skip it only when every changed file is documentation or
      # repository metadata; any uncertainty keeps the job.
      - name: Decide whether Windows compatibility must run
        id: windows
        shell: bash
        run: |
          required=true

          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' && "${HEAD_REF}" != 'changeset-release/main' && "${HEAD_REF}" != release/v* ]]; then
            if files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)') \
              && [[ -n "${files}" && "${CHANGED_FILES}" -lt 3000 ]]; then
              required=false

              while IFS= read -r file; do
                case "${file}" in
                  .github/workflows/*) required=true ;;
                  apps/docs/*|.changeset/*|.claude/*|.agents/*|.github/*|.vscode/*|assets/*|*.md) ;;
                  *) required=true ;;
                esac
              done <<< "${files}"
            fi
          fi

          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          echo "Windows compatibility required: ${required}" >> "${GITHUB_STEP_SUMMARY}"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}

  contracts:
    name: Affected integration
    if: github.event_name != 'pull_request' || (github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version-file: .nvmrc
          task-cache-path: .turbo/cache
          task-cache-key: ci-contracts
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"
      - name: Build integration test dependencies
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-tests... --concurrency=50%
      - name: Run affected tests and integration contracts
        run: pnpm run test:affected

  build:
    if: github.event_name != 'pull_request' || (github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x ]

    # Turbo remote cache — set TURBO_TOKEN and TURBO_TEAM in repo secrets for cross-run caching
    # See: https://turbo.build/repo/docs/ci/github-actions#remote-caching
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      # better-tailwindcss uses Synckit workers that can exceed the default
      # 30-second timeout while the full workspace runs concurrently.
      SYNCKIT_TIMEOUT: 120000

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '22.x' && '.nvmrc' || '' }}
          task-cache-path: .turbo/cache
          task-cache-key: ci-build
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"
      - name: Run affected package checks (Node 22.x)
        if: matrix.node-version == '22.x'
        run: pnpm exec turbo run build typecheck lint --affected --concurrency=50%
      - name: Build affected packages (Node 24.x)
        if: matrix.node-version == '24.x'
        run: pnpm exec turbo run build --affected --concurrency=50%
      # Pull requests test the packages they affect; pushes to main always run
      # the complete suites, and release candidates run them in the release gate.
      - name: Enforce test coverage thresholds (Node 22.x)
        if: matrix.node-version == '22.x'
        run: pnpm exec turbo run test:coverage ${{ github.event_name == 'pull_request' && '--affected' || '' }} --concurrency=50%
      - name: Run tests (Node 24.x)
        if: matrix.node-version == '24.x'
        run: pnpm exec turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }} --concurrency=50%
      - name: Run repository checks (Node 22.x)
        if: matrix.node-version == '22.x'
        run: pnpm run lint:changed && pnpm run check:internal-compatibility
      - name: Check package READMEs are in sync
        if: matrix.node-version == '22.x'
        run: |
          pnpm run docs:sync-readmes
          if ! git diff --exit-code -- 'packages/*/README.md'; then
            echo "Package READMEs are stale. Run 'pnpm run docs:sync-readmes' and commit the result."
            exit 1
          fi
      - name: Package metrics
        if: matrix.node-version == '22.x'
        run: pnpm run check:package-metrics
      - name: Core performance budget
        if: matrix.node-version == '22.x'
        run: pnpm run check:performance

  package-validation:
    name: Affected package artifacts (Node 22.x)
    if: github.event_name != 'pull_request' || (github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version-file: .nvmrc
          task-cache-path: .turbo/cache
          task-cache-key: ci-package-validation
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"
      - name: Build affected publishable packages
        run: pnpm exec turbo run build --affected --concurrency=50%
      - name: Dry-run affected publish artifacts
        run: pnpm run check:publish-dry-run -- --allow-empty
      - name: Check affected published types (attw)
        run: pnpm run check:attw -- --allow-empty

  package-manager-consumers:
    name: ${{ matrix.manager }} packed consumer (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        manager: [bun, npm, pnpm, yarn]
        node-version: [22.x]
        include:
          - manager: npm
            node-version: 24.x

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version == '22.x' && '.nvmrc' || '' }}
          task-cache-path: .turbo/cache
          task-cache-key: ci-consumers
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"
      - name: Setup Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Setup Yarn
        if: matrix.manager == 'yarn'
        run: corepack install --global yarn@stable
      - name: Build lean consumer packages
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-basic... --concurrency=50%
      - name: Verify packed consumer
        run: pnpm run check:package-managers -- --manager ${{ matrix.manager }}

  release-candidate:
    name: Full release candidate
    if: github.event_name == 'pull_request' && (github.head_ref == 'changeset-release/main' || startsWith(github.head_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      SYNCKIT_TIMEOUT: 120000

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version-file: .nvmrc
          task-cache-path: .turbo/cache
          task-cache-key: ci-release-candidate
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"
      - name: Validate release branch and version plan
        shell: bash
        run: |
          RELEASE_PREVIOUS_VERSION=$(git show "${RELEASE_BASE_SHA}:packages/basic/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          export RELEASE_PREVIOUS_VERSION
          node scripts/check-release-source.mjs
        env:
          RELEASE_CANDIDATE: "true"
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Run final release gate once
        run: |
          pnpm run release:check
          pnpm audit --audit-level=high

  windows-smoke:
    name: Windows smoke (CLI + detection)
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Restoring the ~600 MB pnpm store on Windows takes longer than downloading
      # it, so this job installs straight from the registry. The task cache is
      # keyed by operating system and only replays builds produced on Windows.
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version-file: .nvmrc
          cache: "false"
          task-cache-path: .turbo/cache
          task-cache-key: ci-windows
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"
      - name: Build CLI dependencies (serialised to avoid native-binary contention on Windows)
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-basic --concurrency=1 --output-logs=new-only
      - name: Run CLI and detection tests on Windows
        run: pnpm --filter @santi020k/eslint-config-tests exec vitest run src/cli.test.ts src/detection.test.ts src/detection-fixtures.test.ts src/detection-internals.test.ts --maxWorkers=1

  release-node24:
    name: Release compatibility (Node 24.x)
    if: github.event_name == 'pull_request' && (github.head_ref == 'changeset-release/main' || startsWith(github.head_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version: 24.x
          task-cache-path: .turbo/cache
          task-cache-key: ci-release-node24
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"
      - name: Build test dependencies
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-tests... --concurrency=50%
      - name: Verify final candidate contracts
        run: pnpm run test:run

  quality-gate:
    name: Quality gate
    if: always()
    needs: [scope, impact-plan, contracts, build, package-validation, package-manager-consumers, release-candidate, release-node24, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify every selected job
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/quality-gate.mjs
