name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CI_HEAD_SHA: ${{ github.sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      SYNCKIT_TIMEOUT: 120000
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitprompt validate --json --input -

      - name: Detect documentation changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs=false
          coverage=false
          while IFS= read -r file; do
            case "$file" in
              apps/docs/*|packages/*/README.md|.github/workflows/docs.yml)
                docs=true
                ;;
            esac
            case "$file" in
              packages/*/src/*|packages/tests/*|scripts/check-package-coverage.mjs|scripts/coverage-policy.json)
                coverage=true
                ;;
            esac
          done < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

      - name: Run final release gate
        if: github.head_ref == 'changeset-release/main'
        run: pnpm run release:check

      - name: Build integration test dependencies
        if: github.head_ref != 'changeset-release/main'
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-tests... --concurrency=50%

      - name: Run affected tests and integration contracts
        if: github.head_ref != 'changeset-release/main' && steps.changes.outputs.coverage != 'true'
        run: pnpm run test:affected

      - name: Enforce test coverage thresholds
        if: github.head_ref != 'changeset-release/main' && steps.changes.outputs.coverage == 'true'
        run: pnpm --filter @santi020k/eslint-config-tests run test:coverage

      - name: Run affected package checks
        if: github.head_ref != 'changeset-release/main'
        run: pnpm exec turbo run build typecheck lint --affected --concurrency=50%

      - name: Run repository checks
        if: github.head_ref != 'changeset-release/main'
        run: |
          pnpm run lint:changed
          pnpm run check:internal-compatibility
          pnpm run check:package-metrics
          pnpm run check:performance

      - name: Check package READMEs are in sync
        if: github.head_ref != 'changeset-release/main'
        run: |
          pnpm run docs:sync-readmes
          git diff --exit-code -- 'packages/*/README.md' || {
            echo "Package READMEs are stale. Run pnpm run docs:sync-readmes and commit the result."
            exit 1
          }

      - name: Validate affected package artifacts
        if: github.head_ref != 'changeset-release/main'
        run: |
          pnpm run check:publish-dry-run -- --allow-empty
          pnpm run check:attw -- --allow-empty

      - name: Lint affected playgrounds
        if: github.head_ref != 'changeset-release/main'
        run: pnpm exec turbo run lint --affected --filter="@playground/*" --filter="@santi020k/playground-*"

      - name: Require a changeset
        if: >-
          ${{
            github.head_ref != 'changeset-release/main' &&
            !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
            !startsWith(github.event.pull_request.title, 'chore(release): version packages') &&
            !startsWith(github.head_ref, 'release/')
          }}
        run: |
          pnpm exec changeset status --since=origin/main
          pnpm run check:full-release

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate --ignore-registry-errors

      - name: Build documentation
        if: steps.changes.outputs.docs == 'true' && github.head_ref != 'changeset-release/main'
        run: pnpm run docs:build

      - name: Install Playwright browser
        if: steps.changes.outputs.docs == 'true' && github.head_ref != 'changeset-release/main'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/docs

      - name: Test documentation accessibility and budgets
        if: steps.changes.outputs.docs == 'true' && github.head_ref != 'changeset-release/main'
        run: |
          pnpm run docs:test:a11y
          pnpm --filter @santi020k/eslint-config-docs run lighthouse

      - name: Setup Node.js 24
        if: github.head_ref == 'changeset-release/main'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Test release candidate on Node.js 24
        if: github.head_ref == 'changeset-release/main'
        run: pnpm exec turbo run build test --force --concurrency=50%

      - name: Restore Node.js 22
        if: github.head_ref == 'changeset-release/main'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Bun
        if: github.head_ref == 'changeset-release/main'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Yarn
        if: github.head_ref == 'changeset-release/main'
        run: corepack install --global yarn@stable

      - name: Verify packed consumers
        if: github.head_ref == 'changeset-release/main'
        run: |
          pnpm exec turbo run build --filter=@santi020k/eslint-config-basic... --concurrency=50%
          for manager in bun npm pnpm yarn; do
            pnpm run check:package-managers -- --manager "$manager"
          done

  windows-smoke:
    name: Windows smoke
    if: github.head_ref == 'changeset-release/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build CLI dependencies
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-basic --concurrency=1 --output-logs=new-only

      - name: Run CLI and detection tests
        run: pnpm --filter @santi020k/eslint-config-tests exec vitest run src/cli.test.ts src/detection.test.ts src/detection-fixtures.test.ts src/detection-internals.test.ts --maxWorkers=1
