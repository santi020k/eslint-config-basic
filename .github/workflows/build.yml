name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Affected integration
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Turborepo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-22.x-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-22.x-
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - name: Build integration test dependencies
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-tests... --concurrency=50%
      - name: Run affected tests and integration contracts
        run: pnpm run test:affected

  build:
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x ]

    # Turbo remote cache — set TURBO_TOKEN and TURBO_TEAM in repo secrets for cross-run caching
    # See: https://turbo.build/repo/docs/ci/github-actions#remote-caching
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      # better-tailwindcss uses Synckit workers that can exceed the default
      # 30-second timeout while the full workspace runs concurrently.
      SYNCKIT_TIMEOUT: 120000

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Turborepo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - name: Run affected package checks (Node 22.x)
        if: matrix.node-version == '22.x'
        run: pnpm exec turbo run build typecheck lint --affected --concurrency=50%
      - name: Build affected packages (Node 24.x)
        if: matrix.node-version == '24.x'
        run: pnpm exec turbo run build --affected --concurrency=50%
      - name: Enforce test coverage thresholds (Node 22.x)
        if: matrix.node-version == '22.x'
        run: pnpm exec turbo run test:coverage --concurrency=50%
      - name: Run tests (Node 24.x)
        if: matrix.node-version == '24.x'
        run: pnpm exec turbo run test --concurrency=50%
      - name: Run repository checks (Node 22.x)
        if: matrix.node-version == '22.x'
        run: pnpm run lint:changed && pnpm run check:internal-compatibility
      - name: Check package READMEs are in sync
        if: matrix.node-version == '22.x'
        run: pnpm run docs:sync-readmes && git diff --exit-code -- 'packages/*/README.md' || (echo 'Package READMEs are stale. Run `pnpm run docs:sync-readmes` and commit the result.' && exit 1)
      - name: Package metrics
        if: matrix.node-version == '22.x'
        run: pnpm run check:package-metrics
      - name: Core performance budget
        if: matrix.node-version == '22.x'
        run: pnpm run check:performance

  package-validation:
    name: Affected package artifacts (Node 22.x)
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.sha }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Turborepo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-package-validation-22.x-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-22.x-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
            ${{ runner.os }}-turbo-package-validation-22.x-
            ${{ runner.os }}-turbo-22.x-
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - name: Build affected publishable packages
        run: pnpm exec turbo run build --affected --concurrency=50%
      - name: Dry-run affected publish artifacts
        run: pnpm run check:publish-dry-run -- --allow-empty
      - name: Check affected published types (attw)
        run: pnpm run check:attw -- --allow-empty

  package-manager-consumers:
    name: ${{ matrix.manager }} packed consumer (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        manager: [bun, npm, pnpm, yarn]
        node-version: [22.x]
        include:
          - manager: npm
            node-version: 24.x

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Setup Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Setup Yarn
        if: matrix.manager == 'yarn'
        run: corepack install --global yarn@stable
      - run: pnpm install --frozen-lockfile
      - name: Build lean consumer packages
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-basic... --concurrency=50%
      - name: Verify packed consumer
        run: pnpm run check:package-managers -- --manager ${{ matrix.manager }}

  release-candidate:
    name: Full release candidate
    if: github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      SYNCKIT_TIMEOUT: 120000

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run final release gate once
        run: pnpm run release:check

  windows-smoke:
    name: Windows smoke (CLI + detection)
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build CLI dependencies (serialised to avoid native-binary contention on Windows)
        run: pnpm exec turbo run build --filter=@santi020k/eslint-config-basic --concurrency=1 --output-logs=new-only
      - name: Run CLI and detection tests on Windows
        run: pnpm --filter @santi020k/eslint-config-tests exec vitest run src/cli.test.ts src/detection.test.ts src/detection-fixtures.test.ts src/detection-internals.test.ts --maxWorkers=1
