name: Deploy Docs

on:
  # Deploy after a successful Release so docs stay in sync with what was just published to npm.
  # The Release workflow only publishes on Version-Packages PR merges, so this fires at the right time.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Also deploy on doc-only commits that don't go through a release (e.g. typo fixes, new guides).
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test only — skip the Pages deploy (useful for branch verification)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

# Never cancel a deploy in progress — a partial Pages deploy can leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip when triggered by a failed/cancelled Release run.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run events expose the triggering commit on a different context key.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run docs:sync-readmes

      - run: pnpm run build

      - name: Build docs site
        env:
          DOCS_BASE: /
          DOCS_SITE_URL: https://eslint.santi020k.com
        run: pnpm run docs:build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/docs

      - name: Run A11y and SEO Tests
        run: pnpm run docs:test:a11y

      - name: Run Lighthouse CI
        run: pnpm --filter @santi020k/eslint-config-docs run lighthouse

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

      - name: Open issue on build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Docs build failed — site may be out of sync with latest release',
              body: [
                `The docs **build** step failed on commit \`${sha}\`.`,
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The docs site was **not** redeployed. If a release was just published to npm, the live docs may be stale.',
                'To redeploy, fix the build and trigger a manual run via **Actions → Deploy Docs → Run workflow**.',
              ].join('\n'),
              labels: ['bug', 'documentation'],
            })

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !inputs.dry_run }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Open issue on deploy failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Docs deploy to GitHub Pages failed — site may be out of sync with latest release',
              body: [
                `The docs **deploy** step failed on commit \`${sha}\` (the artifact was built successfully but Pages rejected the deploy).`,
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'To redeploy, trigger a manual run via **Actions → Deploy Docs → Run workflow**.',
              ].join('\n'),
              labels: ['bug', 'documentation'],
            })
