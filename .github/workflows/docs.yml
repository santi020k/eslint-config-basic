name: Deploy Docs

on:
  # Deploy after a successful Release so docs stay in sync with what was just published to npm.
  # The Release workflow only publishes on Version-Packages PR merges, so this fires at the right time.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Also deploy on doc-only commits that don't go through a release (e.g. typo fixes, new guides).
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/README.md'
      - '.github/workflows/docs.yml'
      - 'scripts/check-live-docs.mjs'
      - 'scripts/resolve-docs-commit.*'
  # Run the complete deployment gates before docs changes can merge, without deploying the PR.
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/README.md'
      - '.github/workflows/docs.yml'
      - 'scripts/check-live-docs.mjs'
      - 'scripts/resolve-docs-commit.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test only — skip the Pages deploy (useful for branch verification)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Cancel superseded PR checks, but never interrupt a release or production deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      deploys-with-release: ${{ steps.source.outputs.deploys-with-release }}
    # Skip when triggered by a failed/cancelled Release run.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts

      - name: Resolve documentation source
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { isReleaseMergePush, resolveDocsCommit } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/resolve-docs-commit.mjs`)
            const workflowRun = context.payload.workflow_run
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const sourceCommit = workflowRun?.event === 'pull_request' ? workflowRun.head_sha : context.sha
            const pullRequests = workflowRun?.event === 'pull_request' || context.eventName === 'push' ?
              await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                ...context.repo,
                commit_sha: sourceCommit,
              }) : []
            // A merged release pull request publishes through the Release workflow,
            // which triggers this deployment again once npm is up to date. Building
            // the same commit for the push as well would deploy the docs twice.
            const deploysWithRelease = isReleaseMergePush({
              eventName: context.eventName,
              commit: context.sha,
              repository,
              pullRequests,
            })
            core.setOutput('deploys-with-release', String(deploysWithRelease))
            if (deploysWithRelease) core.notice('The Release workflow deploys this merged release after publishing.')
            core.setOutput('commit', resolveDocsCommit({
              eventName: context.eventName,
              commit: context.sha,
              repository,
              workflowRun,
              pullRequests,
            }))

  build:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      commit: ${{ needs.plan.outputs.commit }}
    if: needs.plan.outputs.deploys-with-release != 'true'

    env:
      TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Closed-PR Release runs report the PR head, not its squash-merged commit.
          ref: ${{ needs.plan.outputs.commit }}
          # Starlight's last-updated dates require the source file's history.
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version-file: .nvmrc
          install: false

      - name: Turborepo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run docs:sync-readmes

      - run: pnpm run build

      - name: Build docs site
        env:
          DOCS_BASE: /
          DOCS_SITE_URL: https://eslint.santi020k.com
        run: pnpm run docs:build

      # Browser builds change only with the installed Playwright release, so key
      # the cache on that version instead of every lockfile change.
      - name: Resolve Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(pnpm exec playwright --version | tr -cd '0-9.')" >> "${GITHUB_OUTPUT}"
        working-directory: apps/docs

      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-all-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: apps/docs

      - name: Run A11y and SEO Tests
        run: pnpm run docs:test:a11y

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-diagnostics
          path: |
            apps/docs/test-results
            apps/docs/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Lighthouse budgets
        run: pnpm --filter @santi020k/eslint-config-docs run lighthouse

      - name: Stamp deployment commit
        run: |
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; import { execFileSync } from 'node:child_process'; writeFileSync('apps/docs/dist/release-build.json', JSON.stringify({ commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() }))"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  report-build-failure:
    needs: [plan, build]
    if: ${{ always() && (needs.plan.result == 'failure' || needs.build.result == 'failure') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open issue on build failure
        uses: actions/github-script@v7
        env:
          DOCS_SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
        with:
          script: |
            const sha = process.env.DOCS_SOURCE_COMMIT || context.payload.workflow_run?.head_sha || context.sha
            const title = 'Docs build failed — site may be out of sync with latest release'
            const body = [
              `The docs **build** step failed on commit \`${sha}\`.`,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The docs site was **not** redeployed. If a release was just published to npm, the live docs may be stale.',
              'To redeploy, fix the build and trigger a manual run via **Actions → Deploy Docs → Run workflow**.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existingIssue = openIssues.find(issue => !issue.pull_request && issue.title === title)

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'documentation'],
              })
            }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    # Pull requests validate the exact build artifact but must never publish it.
    if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify live documentation
        run: node scripts/check-live-docs.mjs
        env:
          DOCS_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
          DOCS_EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}

      - name: Open issue on deploy failure
        if: failure()
        uses: actions/github-script@v7
        env:
          DOCS_SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        with:
          script: |
            const sha = process.env.DOCS_SOURCE_COMMIT || context.payload.workflow_run?.head_sha || context.sha
            const title = 'Docs deploy to GitHub Pages failed — site may be out of sync with latest release'
            const body = [
              `Documentation deployment or live verification failed for commit \`${sha}\`. Check the linked workflow for the failing step.`,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'To redeploy, trigger a manual run via **Actions → Deploy Docs → Run workflow**.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existingIssue = openIssues.find(issue => !issue.pull_request && issue.title === title)

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'documentation'],
              })
            }
