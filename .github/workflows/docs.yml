name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/CHANGELOG.md'
      - 'packages/*/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test only — skip the Pages deploy (useful for branch verification)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Turborepo Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run docs:sync-readmes

      - run: pnpm run build

      - name: Build docs site
        env:
          DOCS_BASE: /
          DOCS_SITE_URL: https://eslint.santi020k.com
        run: pnpm run docs:build

      - name: Cache Playwright Browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/docs

      - name: Run A11y and SEO Tests
        run: pnpm run docs:test:a11y

      - name: Run Lighthouse budgets
        run: pnpm --filter @santi020k/eslint-config-docs run lighthouse

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/docs/dist

  report-build-failure:
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open issue on build failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha
            const title = 'Docs build failed — site may be out of sync with latest release'
            const body = [
              `The docs **build** step failed on commit \`${sha}\`.`,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The docs site was **not** redeployed. If a release was just published to npm, the live docs may be stale.',
              'To redeploy, fix the build and trigger a manual run via **Actions → Deploy Docs → Run workflow**.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existingIssue = openIssues.find(issue => !issue.pull_request && issue.title === title)

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'documentation'],
              })
            }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    if: ${{ !inputs.dry_run }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Open issue on deploy failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha
            const title = 'Docs deploy to GitHub Pages failed — site may be out of sync with latest release'
            const body = [
              `The docs **deploy** step failed on commit \`${sha}\` (the artifact was built successfully but Pages rejected the deploy).`,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'To redeploy, trigger a manual run via **Actions → Deploy Docs → Run workflow**.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existingIssue = openIssues.find(issue => !issue.pull_request && issue.title === title)

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'documentation'],
              })
            }
