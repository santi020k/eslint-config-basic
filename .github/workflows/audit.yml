name: Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/*/package.json'
      - 'apps/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vendor/braces/**'
      - 'vendor/minimatch/**'
      - 'scripts/check-minimatch-guard.mjs'
      - 'scripts/check-braces-guard.mjs'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
      - name: Verify maintained braces remediation
        run: node scripts/check-braces-guard.mjs

      - name: Verify maintained minimatch remediation
        run: node scripts/check-minimatch-guard.mjs
