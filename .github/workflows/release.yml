name: Release
# cspell:ignore pipefail

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing and tagging must finish as one transaction.
  cancel-in-progress: false

jobs:
  release:
    # A normal push to main can prepare a release PR, but it can never publish.
    # Publishing requires merging the branch managed by changesets/action.
    if: >-
      ${{
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'changeset-release/main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate versioned packages
        run: |
          pnpm run release:build-versioned
          pnpm run check:internal-compatibility
          pnpm run check:publish-dry-run
          pnpm run check:attw
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Publish versioned packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm run release:publish
          createGithubReleases: true
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Changesets creates one tag per published package. Only a Basic release
      # updates the umbrella and rolling Action tags; independent releases for
      # other packages must never move those tags back to an older Basic commit.
      - name: Reconcile umbrella version tag
        if: steps.changesets.outcome == 'success'
        shell: bash
        run: |
          set -eu

          VERSION=$(node -p "require('./packages/basic/package.json').version")
          TAG="v${VERSION}"
          MAJOR_TAG="v${VERSION%%.*}"
          PACKAGE_TAG="@santi020k/eslint-config-basic@${VERSION}"

          if ! git rev-parse --verify --quiet "refs/tags/${PACKAGE_TAG}" >/dev/null; then
            git fetch --quiet origin "refs/tags/${PACKAGE_TAG}:refs/tags/${PACKAGE_TAG}" || true
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${PACKAGE_TAG}" >/dev/null; then
            echo "Package tag ${PACKAGE_TAG} does not exist yet; no umbrella tag is needed."
            exit 0
          fi

          RELEASE_COMMIT=$(git rev-list -n 1 "${PACKAGE_TAG}")
          CURRENT_RELEASE_COMMIT=$(git rev-parse HEAD)

          if [[ "${RELEASE_COMMIT}" != "${CURRENT_RELEASE_COMMIT}" ]]; then
            echo "Basic package tag ${PACKAGE_TAG} does not point to the current release commit; umbrella tags remain unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "${TAG}")
            if [[ "${TAG_COMMIT}" != "${RELEASE_COMMIT}" ]]; then
              echo "::error::Tag ${TAG} already points to ${TAG_COMMIT}, expected ${RELEASE_COMMIT}."
              exit 1
            fi

            echo "Tag ${TAG} already points to the release commit; nothing to do."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}" "${RELEASE_COMMIT}"
            git push origin "refs/tags/${TAG}"
            echo "Created umbrella release tag ${TAG}." >> "$GITHUB_STEP_SUMMARY"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${MAJOR_TAG}" -m "Release ${MAJOR_TAG}" "${RELEASE_COMMIT}"
          git push --force origin "refs/tags/${MAJOR_TAG}"
          echo "Updated rolling action tag ${MAJOR_TAG}." >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0

      # These packages remain installable throughout v3 so existing consumers
      # receive a migration message instead of a broken dependency. Do not
      # deprecate v2, where Lite and Integrations are still supported entry points.
      - name: Mark v3 compatibility packages as deprecated
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail

          deprecate_versions() {
            local package_name="$1"
            local version_range="$2"
            local message="$3"
            local versions

            versions=$(npm view "${package_name}@${version_range}" version --json | node -e '
              let input = ""
              process.stdin.on("data", chunk => { input += chunk })
              process.stdin.on("end", () => {
                const parsed = JSON.parse(input)
                for (const version of Array.isArray(parsed) ? parsed : [parsed]) console.log(version)
              })
            ')

            while IFS= read -r package_version; do
              [[ -n "$package_version" ]] || continue

              local current
              current=$(npm view "${package_name}@${package_version}" deprecated 2>/dev/null || true)

              if [[ "$current" == "$message" ]]; then
                echo "${package_name}@${package_version} already has the intended deprecation notice."
              else
                npm deprecate "${package_name}@${package_version}" "$message"
              fi
            done <<< "$versions"
          }

          VERSION=$(node -p "require('./packages/basic/package.json').version")
          if [[ "$VERSION" == 3.* ]]; then
            deprecate_versions '@santi020k/eslint-config-lite' '3.x' \
              'Deprecated in v3; migrate to @santi020k/eslint-config-basic. This package will be removed in v4.'
            deprecate_versions '@santi020k/eslint-config-integrations' '3.x' \
              'Deprecated in v3; install the extensions, formats, libraries, testing, or tools package directly. This package will be removed in v4.'
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
