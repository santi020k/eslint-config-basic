name: Release
# cspell:ignore pipefail

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing and tagging must finish as one transaction.
  cancel-in-progress: false

jobs:
  release:
    # A normal push to main can prepare a release PR, but it can never publish.
    # Publishing requires merging the branch managed by changesets/action. A
    # manual workflow dispatch is reserved for idempotent release recovery.
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.ref == 'changeset-release/main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.20.0

      - name: Build and validate versioned packages
        run: |
          pnpm run release:build-versioned
          pnpm run check:internal-compatibility
          pnpm run check:publish-dry-run
          pnpm run check:attw
        env:
          RELEASE_BUILD_ALL_IF_UNVERSIONED: "true"
          RELEASE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Publish versioned packages
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm run release:publish
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          HUSKY: 0
          NPM_CONFIG_PROVENANCE: "true"

      # Changesets creates one tag and GitHub Release per published package. The
      # Basic package owns the umbrella Release and rolling Action tag. Manage
      # both through GitHub's API so the workflow token never needs to push Git
      # refs that contain workflow-file changes.
      - name: Reconcile umbrella GitHub release
        if: steps.changesets.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./packages/basic/package.json').version")
          TAG="v${VERSION}"
          MAJOR_TAG="v${VERSION%%.*}"
          PACKAGE_TAG="@santi020k/eslint-config-basic@${VERSION}"

          if ! git rev-parse --verify --quiet "refs/tags/${PACKAGE_TAG}" >/dev/null; then
            git fetch --quiet origin "refs/tags/${PACKAGE_TAG}:refs/tags/${PACKAGE_TAG}" || true
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${PACKAGE_TAG}" >/dev/null; then
            echo "Package tag ${PACKAGE_TAG} does not exist yet; no umbrella tag is needed."
            exit 0
          fi

          RELEASE_COMMIT=$(git rev-list -n 1 "${PACKAGE_TAG}")

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "${TAG}")
            if [[ "${TAG_COMMIT}" != "${RELEASE_COMMIT}" ]]; then
              echo "::error::Tag ${TAG} already points to ${TAG_COMMIT}, expected ${RELEASE_COMMIT}."
              exit 1
            fi

            echo "Tag ${TAG} already points to the release commit; nothing to do."
          else
            echo "GitHub Release creation will create tag ${TAG} at ${RELEASE_COMMIT}."
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; nothing to do."
          else
            RELEASE_BODY=$(gh release view "${PACKAGE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json body \
              --jq '.body')

            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" \
              -f target_commitish="${RELEASE_COMMIT}" \
              -f name="${TAG}" \
              -f body="${RELEASE_BODY}" >/dev/null
            echo "Created umbrella GitHub Release ${TAG}." >> "$GITHUB_STEP_SUMMARY"
          fi

          if git rev-parse --verify --quiet "refs/tags/${MAJOR_TAG}" >/dev/null; then
            MAJOR_TAG_COMMIT=$(git rev-list -n 1 "${MAJOR_TAG}")

            if [[ "${MAJOR_TAG_COMMIT}" != "${RELEASE_COMMIT}" ]]; then
              if ! git merge-base --is-ancestor "${MAJOR_TAG_COMMIT}" "${RELEASE_COMMIT}"; then
                echo "::error::Refusing to move ${MAJOR_TAG} backwards from ${MAJOR_TAG_COMMIT} to ${RELEASE_COMMIT}."
                exit 1
              fi

              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" \
                -f sha="${RELEASE_COMMIT}" \
                -F force=true >/dev/null
              echo "Updated rolling action tag ${MAJOR_TAG}." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR_TAG}" \
              -f sha="${RELEASE_COMMIT}" >/dev/null
            echo "Created rolling action tag ${MAJOR_TAG}." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm OIDC intentionally authenticates publish commands only. Metadata
      # updates still need a valid granular token, so detect an expired token
      # without allowing it to invalidate an otherwise successful release.
      - name: Check npm metadata token
        id: npm-metadata-token
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if npm whoami >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN cannot authenticate; skipping compatibility-package deprecation updates."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # These packages remain installable throughout v3 so existing consumers
      # receive a migration message instead of a broken dependency. Do not
      # deprecate v2, where Lite and Integrations are still supported entry points.
      - name: Mark v3 compatibility packages as deprecated
        if: steps.npm-metadata-token.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          deprecate_versions() {
            local package_name="$1"
            local version_range="$2"
            local message="$3"
            local versions

            versions=$(npm view "${package_name}@${version_range}" version --json | node -e '
              let input = ""
              process.stdin.on("data", chunk => { input += chunk })
              process.stdin.on("end", () => {
                const parsed = JSON.parse(input)
                for (const version of Array.isArray(parsed) ? parsed : [parsed]) console.log(version)
              })
            ')

            while IFS= read -r package_version; do
              [[ -n "$package_version" ]] || continue

              local current
              current=$(npm view "${package_name}@${package_version}" deprecated 2>/dev/null || true)

              if [[ "$current" == "$message" ]]; then
                echo "${package_name}@${package_version} already has the intended deprecation notice."
              else
                npm deprecate "${package_name}@${package_version}" "$message"
              fi
            done <<< "$versions"
          }

          VERSION=$(node -p "require('./packages/basic/package.json').version")
          if [[ "$VERSION" == 3.* ]]; then
            deprecate_versions '@santi020k/eslint-config-lite' '3.x' \
              'Deprecated in v3; migrate to @santi020k/eslint-config-basic. This package will be removed in v4.'
            deprecate_versions '@santi020k/eslint-config-integrations' '3.x' \
              'Deprecated in v3; install the extensions, formats, libraries, testing, or tools package directly. This package will be removed in v4.'
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
