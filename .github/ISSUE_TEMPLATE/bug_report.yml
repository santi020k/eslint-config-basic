name: 🐛 Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: When I run eslint, it crashes with error...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Please provide a link to a reproduction repository or a minimal code snippet.
        This is critical for us to understand and fix the issue.
      placeholder: |
        1. create a new project with...
        2. install @santi020k/eslint-config-basic
        3. run eslint . --max-warnings=0
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: checkboxes
    id: packages
    attributes:
      label: Packages Affected
      description: Select the packages that seem to be causing the issue.
      options:
        - label: "@santi020k/eslint-config-basic"
        - label: "@santi020k/eslint-config-lite"
        - label: "@santi020k/eslint-config-core"
        - label: "@santi020k/eslint-config-typescript"
        - label: "@santi020k/eslint-config-integrations"
        - label: "@santi020k/eslint-config-react"
        - label: "@santi020k/eslint-config-next"
        - label: "@santi020k/eslint-config-nuxt"
        - label: "@santi020k/eslint-config-astro"
        - label: "@santi020k/eslint-config-vue"
        - label: "@santi020k/eslint-config-svelte"
        - label: "@santi020k/eslint-config-solid"
        - label: "@santi020k/eslint-config-angular"
        - label: "@santi020k/eslint-config-nest"
        - label: "@santi020k/eslint-config-hono"
        - label: "@santi020k/eslint-config-expo"
        - label: "@santi020k/eslint-config-preact"
        - label: "@santi020k/eslint-config-qwik"
        - label: "@santi020k/eslint-config-react-router"
        - label: "@santi020k/eslint-config-remix (deprecated alias of react-router)"
        - label: "@santi020k/eslint-config-tanstack-start"
        - label: "@santi020k/eslint-config-lit"
        - label: "@santi020k/eslint-config-vite"
        - label: "@santi020k/eslint-config-slidev"

  - type: input
    id: version
    attributes:
      label: Package Version
      description: Which version of `@santi020k/eslint-config-basic` are you using?
      placeholder: "e.g. 2.1.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: |
        Run `npx envinfo --system --binaries --npmPackages "{eslint,@santi020k/*,typescript}"` and paste the output here.
      placeholder: |
        System:
          OS: macOS 15.0
          CPU: Apple M3
        Binaries:
          Node: 22.19.0
          pnpm: 10.0.0
        npmPackages:
          eslint: ^10.0.0 => 10.5.0
          @santi020k/eslint-config-basic: ^2.0.0 => 2.1.0
    validations:
      required: false
