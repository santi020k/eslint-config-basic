name: ✨ Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this feature solve? What use case would it enable?
      placeholder: I'm always frustrated when... / This would allow me to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you'd like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've looked at, or workarounds you're currently using.
    validations:
      required: false

  - type: checkboxes
    id: packages
    attributes:
      label: Packages Affected
      description: Select the packages relevant to this feature.
      options:
        - label: "@santi020k/eslint-config-basic"
        - label: "@santi020k/eslint-config-lite"
        - label: "@santi020k/eslint-config-core"
        - label: "@santi020k/eslint-config-typescript"
        - label: "@santi020k/eslint-config-integrations"
        - label: "@santi020k/eslint-config-react"
        - label: "@santi020k/eslint-config-next"
        - label: "@santi020k/eslint-config-nuxt"
        - label: "@santi020k/eslint-config-astro"
        - label: "@santi020k/eslint-config-vue"
        - label: "@santi020k/eslint-config-svelte"
        - label: "@santi020k/eslint-config-solid"
        - label: "@santi020k/eslint-config-angular"
        - label: "@santi020k/eslint-config-nest"
        - label: "@santi020k/eslint-config-hono"
        - label: "@santi020k/eslint-config-expo"
        - label: "@santi020k/eslint-config-preact"
        - label: "@santi020k/eslint-config-qwik"
        - label: "@santi020k/eslint-config-react-router"
        - label: "@santi020k/eslint-config-remix (deprecated alias of react-router)"
        - label: "@santi020k/eslint-config-tanstack-start"
        - label: "@santi020k/eslint-config-lit"
        - label: "@santi020k/eslint-config-vite"
        - label: "@santi020k/eslint-config-slidev"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Links, prior art, related issues, or anything else that might help.
    validations:
      required: false
