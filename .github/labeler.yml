docs:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'packages/*/README.md'
          - 'apps/docs/**'
          - 'llms.txt'
          - 'llms-full.txt'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

# Apply this label manually to PRs that don't need a changeset (chores, CI, docs-only)
skip-changelog:
  - head-branch: ['chore/*', 'ci/*', 'docs/*', 'renovate/*']
